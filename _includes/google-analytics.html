<!-- Cloudflare Web Analytics. Keep it out of the rendering and interaction path. -->
<script>
  window.addEventListener("load", function () {
    var loadBeacon = function () {
      var script = document.createElement("script");
      script.defer = true;
      script.src = "https://static.cloudflareinsights.com/beacon.min.js";
      script.dataset.cfBeacon = '{"token":"ad0084228e15417b9b8604f619f83788"}';
      document.head.appendChild(script);
    };
    if ("requestIdleCallback" in window) window.requestIdleCallback(loadBeacon, { timeout: 3000 });
    else window.setTimeout(loadBeacon, 3000);
  }, { once: true });
</script>
